name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download fonts
        run: |
          D=app/src/main/assets/fonts; mkdir -p $D
          B=https://github.com/google/fonts/raw/main/ofl
          curl -fsSL "$B/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf" -o $D/sg.ttf || true
          curl -fsSL "$B/tajawal/Tajawal-Regular.ttf" -o $D/tj4.ttf || true
          curl -fsSL "$B/tajawal/Tajawal-Medium.ttf" -o $D/tj5.ttf || true
          curl -fsSL "$B/tajawal/Tajawal-Bold.ttf" -o $D/tj7.ttf || true
          ls -la $D
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Sahl-Tijaratak-APK
          path: app/build/outputs/apk/debug/*.apk
